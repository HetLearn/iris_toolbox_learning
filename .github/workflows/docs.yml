# Build the MkDocs site (mkdocs.yml, docs_site/) and deploy it to GitHub Pages.
# Runs on every push to main that changes the site, and by hand from the Actions tab.
# Needs Settings > Pages > Source set to "GitHub Actions" in the repository.
name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs_site/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs_site/requirements.txt

      - name: Install MkDocs Material
        run: pip install -r docs_site/requirements.txt

      - name: Build the site
        run: mkdocs build --strict

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
